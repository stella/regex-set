name: CI

env:
  HAWK_RUST_TOOLCHAIN: "1.97.1"
  HAWK_VERSION: "0.1.12"
  HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256: "f9cafbbc5777b2b00c362619b8b62af942d2900a121acae2e73210a8ebffd857"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    needs: [trust-check]
    if: >-
      always() && !cancelled()
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    runs-on: ubuntu-24.04
    env:
      BASE_REF: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || (github.event_name == 'push' && github.event.before) || 'unavailable-toolchain-base' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-changed: ${{ (steps.filter.outputs.rust == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      build-changed: ${{ (steps.filter.outputs.build == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      provenance-changed: ${{ (steps.filter.outputs.provenance == 'true' || steps.toolchain.outputs.changed == 'true') && 'true' || 'false' }}
      toolchain-changed: ${{ steps.toolchain.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Detect toolchain changes
        id: toolchain
        run: |
          bunx --no-install stll-toolchain-changed --since "$BASE_REF" > "$RUNNER_TEMP/toolchain-changes.json"
          node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (typeof result.changed !== "boolean") throw new Error("Missing toolchain changed result"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + result.changed + "\n");' "$RUNNER_TEMP/toolchain-changes.json"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - 'package.json'
              - 'VERSION'
              - 'src/**'
              - 'crates/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'deny.toml'
              - 'hawk.toml'
              - 'rustfmt.toml'
            build:
              - '__test__/**'
              - 'VERSION'
              - 'src/**'
              - 'crates/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'bun.lock'
              - 'index.cjs'
              - 'tsdown.config.ts'
              - 'scripts/**'
              - 'wasm/**'
              - 'npm/**'
            provenance:
              - 'VERSION'
              - 'bun.lock'
              - 'Cargo.lock'
              - '**/package.json'
              - 'Cargo.toml'
              - 'src/**'
              - 'crates/**'
              - 'wasm/**'
              - '*.js'
              - '*.cjs'
              - '*.mjs'
              - '.provenance.yml'
              - 'provenance/**'
      - name: Enforce Bun workflow installs
        run: node scripts/check-workflow-package-manager.mjs
  trust-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Check if PR is trusted
        id: check
        env:
          HEAD_REPO: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HAS_RUN_CI_LABEL: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'run-ci') }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_RUN_CI_LABEL" == 'true' ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR without 'run-ci' label — CI skipped."
          fi

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request'
      && needs.trust-check.outputs.trusted == 'true'
    needs: [trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: stella/.github/.github/actions/changeset-policy@07debc754995bab35e446511859f1d93e1ad127a
        with:
          release-paths: |
            src/**
            crates/core/src/**
            Cargo.toml
            crates/core/Cargo.toml
            package.json
            wasm/package.json
            index.cjs
            tsdown.config.ts
          generated-paths: |
            CHANGELOG.md
            VERSION
            Cargo.toml
            crates/core/Cargo.toml
            Cargo.lock
            bun.lock
            package.json
            wasm/package.json
            npm/*/package.json
            index.cjs
            provenance/THIRD-PARTY-NOTICES.txt
            provenance/report.json
            provenance/sbom.cdx.json
          package-files: package.json

  checks:
    name: Tooling policy
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun run check:toolchain
        if: needs.check-changes.outputs.toolchain-changed == 'true'
      - run: bun test scripts/tooling-adoption.test.ts scripts/shared-policy.test.ts
      - run: node scripts/build-single-thread.test.mjs
      - run: bun test ./scripts/ci-result.test.ts

  napi-ci:
    if: ${{ always() && !cancelled() && needs.check-changes.result == 'success' && (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') }}
    needs: [check-changes, trust-check]
    uses: stella/.github/.github/workflows/rust-napi-ci.yml@04c86bb54f4ae022354d72f8a40400bc7cf7428c
    with:
      typecheck: true
      node-version: "26.10.0"
      trusted: ${{ (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') && 'true' || 'false' }}
      rust-changed: ${{ needs.check-changes.outputs.rust-changed }}
      build-changed: ${{ needs.check-changes.outputs.build-changed }}
      provenance-changed: ${{ needs.check-changes.outputs.provenance-changed }}
      provenance-version: v0.1.3
      property-test-command: bun run test:props
    secrets: inherit

  single-thread:
    name: Single-thread WebAssembly
    if: ${{ always() && !cancelled() && needs.check-changes.result == 'success' && (github.event_name != 'pull_request' || needs.trust-check.outputs.trusted == 'true') }}
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
          targets: wasm32-wasip1-threads, wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:js
      - run: bun run build:single-thread-package
      - run: bun run test:single-thread

  hawk:
    name: Hawk
    if: >-
      always()
      && !cancelled()
      && needs.check-changes.result == 'success'
      && needs.check-changes.outputs.rust-changed == 'true'
      && (github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true')
    needs: [check-changes, trust-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.1"
      - name: Install pinned Hawk
        shell: bash
        run: |
          set -euo pipefail
          expected_hawk_script="cargo +${HAWK_RUST_TOOLCHAIN} hawk check --target-dir target/hawk -D warnings -A hawk::dead_public -A hawk::unnecessary_public"
          jq -e --arg expected "$expected_hawk_script" \
            '.scripts["rust:hawk"] == $expected' package.json >/dev/null
          archive="${RUNNER_TEMP}/cargo-hawk.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-hawk"
          curl --proto '=https' --tlsv1.2 --retry 3 -fsSL \
            -o "$archive" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_X86_64_UNKNOWN_LINUX_GNU_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check internal Rust visibility
        run: bun run rust:hawk

  ci-result:
    if: always()
    needs:
      [
        check-changes,
        trust-check,
        changeset,
        checks,
        napi-ci,
        single-thread,
        hawk,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject untrusted pull requests
        if: >-
          github.event_name == 'pull_request'
          && needs.trust-check.outputs.trusted != 'true'
        run: exit 1
      - name: Require every selected validation job
        if: >-
          github.event_name != 'pull_request'
          || needs.trust-check.outputs.trusted == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECTOR_RESULT: ${{ needs.check-changes.result }}
          TRUST_RESULT: ${{ needs.trust-check.result }}
          CHANGESET_RESULT: ${{ needs.changeset.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NAPI_RESULT: ${{ needs.napi-ci.result }}
          SINGLE_THREAD_RESULT: ${{ needs.single-thread.result }}
          HAWK_RESULT: ${{ needs.hawk.result }}
        run: |
          test "$DETECTOR_RESULT" = success
          test "$CHECKS_RESULT" = success
          test "$NAPI_RESULT" = success
          test "$SINGLE_THREAD_RESULT" = success

          if [ "$EVENT_NAME" = pull_request ]; then
            test "$TRUST_RESULT" = success
            test "$CHANGESET_RESULT" = success
          else
            # Trust and changeset validation apply only to pull requests.
            if [ "$TRUST_RESULT" != success ] && [ "$TRUST_RESULT" != skipped ]; then
              exit 1
            fi
            if [ "$CHANGESET_RESULT" != success ] && [ "$CHANGESET_RESULT" != skipped ]; then
              exit 1
            fi
          fi

          # Hawk is path-filtered to Rust changes.
          if [ "$HAWK_RESULT" != success ] && [ "$HAWK_RESULT" != skipped ]; then
            exit 1
          fi
