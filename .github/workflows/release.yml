name: Release

env:
  NODE_VERSION: "22"
  # Pinned: bun's `latest` channel autoupdate has bitten release CI.
  BUN_VERSION: "1.4.0"
  CDXGEN_VERSION: "12.1.5"
  CARGO_INCREMENTAL: 0

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the current VERSION to npm after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-ref:
    name: Release ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to_npm
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Manual npm publishing must run from main."
          exit 1

  preflight:
    name: Preflight
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.publish_to_npm != true
      || github.ref == 'refs/heads/main'
    uses: stella/.github/.github/workflows/npm-version-preflight.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      dependency-name-prefixes: |
        @stll/regex-set-
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}

  verify:
    name: Verify
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/version-sync.mjs check
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-verify
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
      - name: License audit
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo test --workspace
      - uses: ./.github/actions/provenance-check
        with:
          provenance-version: v0.1.3
      - run: bun run build
      - run: bun run build:js
      - run: bun run test:runtime:bun
      - run: node scripts/runtime-smoke.mjs
      - run: bun run test:props

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: [preflight, verify]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            os: macos-15
            node_artifact: regex-set.darwin-x64.node
          - target: aarch64-apple-darwin
            os: macos-15
            node_artifact: regex-set.darwin-arm64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node_artifact: regex-set.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            node_artifact: regex-set.linux-arm64-gnu.node
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_artifact: regex-set.win32-x64-msvc.node
          - target: wasm32-wasip1-threads
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-build-${{ matrix.settings.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build native
        if: >-
          !matrix.settings.use-cross
          && matrix.settings.target != 'wasm32-wasip1-threads'
        run: bun run build --target ${{ matrix.settings.target }}
      - name: Build cross-compile
        if: ${{ matrix.settings.use-cross }}
        run: >
          bun run build
          --target ${{ matrix.settings.target }}
          --use-napi-cross
      - name: Build WASM
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: bun run build:wasm
      - name: Upload native binding
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ matrix.settings.node_artifact }}
          if-no-files-found: error
      - name: Upload WASM bindings
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.wasm
            !*.debug.wasm
            *.cjs
            *.d.cts
            *.js
            *.mjs
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: [preflight, build]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
          ls -la -- *.node 2>/dev/null || echo "No .node files"
          ls -la -- *.wasm 2>/dev/null || echo "No .wasm files"
      - run: bun test

  pack:
    name: Pack
    needs: [preflight, verify, test]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install SBOM generator
        # This fixed CLI generates release metadata without receiving publish credentials.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "@cyclonedx/cdxgen@${{ env.CDXGEN_VERSION }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Prepare npm packages
        run: bun x @napi-rs/cli artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
      - run: bun run build:js
      - run: node scripts/prepare-release-package.mjs
      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          root_json="$(npm pack --json --ignore-scripts --pack-destination release-artifacts)"
          root_file="$(echo "$root_json" | jq -r '.[0].filename')"
          root_tarball="release-artifacts/$root_file"

          while IFS= read -r pkg; do
            (
              cd "$pkg"
              npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
            )
          done < <(find npm -mindepth 1 -maxdepth 1 -type d | sort)

          (
            cd wasm
            npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
          )

          mapfile -t aux_tarballs < <(find release-artifacts -maxdepth 1 -name '*.tgz' ! -name "$root_file" | sort)
          node scripts/check-release-tarballs.mjs "$root_tarball" "${aux_tarballs[@]}"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          (
            cd release-artifacts
            sha256sum -- ./*.tgz > SHA256SUMS
          )
      - name: Generate attestation SBOM
        run: >
          cdxgen
          --spec-version 1.6
          --required-only
          --exclude-regex '(^|/)node_modules(/.*)?$'
          --output release-artifacts/attest-sbom.cdx.json
          .
      - name: Stage provenance release assets
        run: |
          set -euo pipefail
          cp provenance/sbom.cdx.json release-artifacts/provenance-sbom.cdx.json
          cp provenance/THIRD-PARTY-NOTICES.txt release-artifacts/provenance-THIRD-PARTY-NOTICES.txt
          cp provenance/report.json release-artifacts/provenance-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  attest:
    name: Attest npm packages
    needs: [preflight, pack]
    if: >-
      needs.preflight.outputs.already-released != 'true'
      && (github.event_name == 'push'
          || (inputs.publish_to_npm && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Resolve package tarballs
        id: tarballs
        shell: bash
        run: |
          set -euo pipefail
          root_tarball=""
          aux_tarballs=()
          while IFS= read -r tarball; do
            name="$(tar -xOf "$tarball" package/package.json | jq -er '.name')"
            if [[ "$name" == '@stll/regex-set' ]]; then
              if [[ -n "$root_tarball" ]]; then
                echo "::error::Multiple root package tarballs were downloaded."
                exit 1
              fi
              root_tarball="$tarball"
              continue
            fi
            aux_tarballs+=("$tarball")
          done < <(find release-artifacts -maxdepth 1 -type f -name '*.tgz' | sort)
          if [[ -z "$root_tarball" ]]; then
            echo "::error::The root package tarball was not downloaded."
            exit 1
          fi
          echo "root_tarball=$root_tarball" >> "$GITHUB_OUTPUT"
          {
            echo 'aux_tarballs<<EOF'
            printf '%s\n' "${aux_tarballs[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Attest root package tarball with SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.tarballs.outputs.root_tarball }}
          sbom-path: release-artifacts/attest-sbom.cdx.json
      - name: Attest auxiliary package tarballs
        if: steps.tarballs.outputs.aux_tarballs != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.tarballs.outputs.aux_tarballs }}

  core-package:
    name: Verify Rust core package
    needs: [preflight, verify, test]
    if: >-
      always()
      && needs.preflight.result == 'success'
      && (needs.preflight.outputs.already-released == 'true'
          || (needs.verify.result == 'success'
              && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: node scripts/version-sync.mjs check
      - name: Verify publishable core package
        run: cargo publish --dry-run --package stella-regex-set-core --locked

  core:
    name: Publish Rust core
    needs: [preflight, core-package]
    if: >-
      needs.core-package.result == 'success'
      && (github.event_name == 'push'
          || (inputs.publish_to_npm && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Check exact crates.io version
        id: crate-status
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          response="${RUNNER_TEMP}/crate-version.json"
          status="$(curl --proto '=https' --tlsv1.2 --retry 3 -sS \
            --user-agent 'stella-regex-set-release' \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/stella-regex-set-core/${version}")"
          case "$status" in
            200)
              jq -e --arg version "$version" \
                '.version.num == $version' "$response" >/dev/null
              echo "already-released=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "already-released=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP ${status}"
              cat "$response"
              exit 1
              ;;
          esac
      - name: Authenticate to crates.io
        id: crates-io-auth
        if: steps.crate-status.outputs.already-released != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Rust core
        if: steps.crate-status.outputs.already-released != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          cargo publish \
            --manifest-path "$GITHUB_WORKSPACE/crates/core/Cargo.toml" \
            --locked \
            --no-verify
        env:
          # Keep repository-controlled Cargo configuration outside the credential path.
          CARGO_HOME: ${{ runner.temp }}/release-cargo-home
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Verify exact crates.io release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          response="${RUNNER_TEMP}/published-crate-version.json"
          for attempt in {1..12}; do
            status="$(curl --proto '=https' --tlsv1.2 --retry 3 -sS \
              --user-agent 'stella-regex-set-release' \
              --output "$response" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/stella-regex-set-core/${version}")"
            if [[ "$status" == 200 ]] &&
              jq -e --arg version "$version" \
                '.version.num == $version' "$response" >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::stella-regex-set-core ${version} is not available"
              exit 1
            fi
            sleep 5
          done

  finalize:
    name: Finalize
    needs: [preflight, pack, attest, core]
    if: >-
      needs.preflight.outputs.already-released != 'true'
      && needs.core.result == 'success'
      && (github.event_name == 'push'
          || (inputs.publish_to_npm && github.ref == 'refs/heads/main'))
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@1ce0079bbdbf93a4c1917d2857496b89aedcec14
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}
      update-changelog: false
    permissions:
      contents: write
      id-token: write
    secrets:
      RELEASE_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
