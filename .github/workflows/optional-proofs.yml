name: Optional proofs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-parity:
    name: Typecheck parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:toolchain
      - run: bun run check:typecheck-parity

  contract-perf:
    name: Contract fixture perf
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: stella/anonymize
          path: .perf/anonymize
          sparse-checkout: |
            crates/anonymize-core/tests/fixtures/assemble
            packages/anonymize/src/__test__/fixtures/contracts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run contract fixture perf guard
        env:
          ANONYMIZE_REPOSITORY_DIR: ${{ github.workspace }}/.perf/anonymize
        run: timeout 180s bun run perf:contracts
