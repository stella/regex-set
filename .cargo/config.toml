# Cargo 1.100+ skips crates.io versions younger than this when resolving,
# unless Cargo.lock already pins them. The shared package-quarantine CI still
# checks every newly locked version against crates.io publish times.
[registry]
global-min-publish-age = "5 days"

# Use sparse index for faster resolution.
[registries.crates-io]
protocol = "sparse"

[alias]
ci-fmt = "fmt --all -- --check"
ci-clippy = "clippy --workspace --all-targets --all-features --locked -- -D warnings"
ci-test = "test --workspace --all-features --locked"
