name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the current VERSION to npm after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-ref:
    name: Release ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to_npm
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Manual npm publishing must run from main."
          exit 1

  preflight:
    name: Preflight
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.publish_to_npm != true
      || github.ref == 'refs/heads/main'
    uses: stella/.github/.github/workflows/npm-version-preflight.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      dependency-name-prefixes: |
        @stll/regex-set-
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}

  verify:
    name: Verify
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
      - run: node scripts/version-sync.mjs check
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-verify
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
      - name: License audit
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo test --workspace
      - uses: ./.github/actions/provenance-check
        with:
          provenance-version: v0.1.3
      - run: bun run build
      - run: bun run build:js
      - run: bun run test:runtime:bun
      - run: node scripts/runtime-smoke.mjs
      - run: bun run test:props

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: [preflight, verify]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.settings.os }}
    env:
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            os: macos-15
            node_artifact: regex-set.darwin-x64.node
          - target: aarch64-apple-darwin
            os: macos-15
            node_artifact: regex-set.darwin-arm64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node_artifact: regex-set.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            node_artifact: regex-set.linux-arm64-gnu.node
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_artifact: regex-set.win32-x64-msvc.node
          - target: wasm32-wasip1-threads
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-build-${{ matrix.settings.target }}
      - run: bun install --frozen-lockfile
      - name: Build native
        if: >-
          !matrix.settings.use-cross
          && matrix.settings.target != 'wasm32-wasip1-threads'
        run: bun run build --target ${{ matrix.settings.target }}
      - name: Build cross-compile
        if: ${{ matrix.settings.use-cross }}
        run: >
          bun run build
          --target ${{ matrix.settings.target }}
          --use-napi-cross
      - name: Build WASM
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: bun run build:wasm
      - name: Upload native binding
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ matrix.settings.node_artifact }}
          if-no-files-found: error
      - name: Upload WASM bindings
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.wasm
            !*.debug.wasm
            *.cjs
            *.d.cts
            *.js
            *.mjs
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: [preflight, build]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
          ls -la -- *.node 2>/dev/null || echo "No .node files"
          ls -la -- *.wasm 2>/dev/null || echo "No .wasm files"
      - run: bun test

  pack:
    name: Pack
    needs: [preflight, verify, test]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
      - run: bun install --frozen-lockfile
      - name: Install SBOM generator
        # This fixed CLI generates release metadata without receiving publish credentials.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "@cyclonedx/cdxgen@12.1.5"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Prepare npm packages
        run: bun x @napi-rs/cli artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
      - run: bun run build:js
      - run: node scripts/prepare-release-package.mjs
      - name: Pack release tarballs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          root_json="$(npm pack --json --ignore-scripts --pack-destination release-artifacts)"
          root_file="$(echo "$root_json" | jq -r '.[0].filename')"
          root_tarball="release-artifacts/$root_file"

          while IFS= read -r pkg; do
            (
              cd "$pkg"
              npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
            )
          done < <(find npm -mindepth 1 -maxdepth 1 -type d | sort)

          (
            cd wasm
            npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
          )

          mapfile -t aux_tarballs < <(find release-artifacts -maxdepth 1 -name '*.tgz' ! -name "$root_file" | sort)
          node scripts/check-release-tarballs.mjs "$root_tarball" "${aux_tarballs[@]}"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          (
            cd release-artifacts
            sha256sum -- ./*.tgz > SHA256SUMS
          )
      - name: Generate attestation SBOM
        run: >
          cdxgen
          --spec-version 1.6
          --required-only
          --exclude-regex '(^|/)node_modules(/.*)?$'
          --output release-artifacts/attest-sbom.cdx.json
          .
      - name: Stage provenance release assets
        run: |
          set -euo pipefail
          cp provenance/sbom.cdx.json release-artifacts/provenance-sbom.cdx.json
          cp provenance/THIRD-PARTY-NOTICES.txt release-artifacts/provenance-THIRD-PARTY-NOTICES.txt
          cp provenance/report.json release-artifacts/provenance-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  attest:
    name: Attest npm packages
    needs: [preflight, pack]
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.preflight.outputs.already-released != 'true'
        && (github.event_name == 'push'
            || inputs.publish_to_npm))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Attest root npm package with SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-artifacts/stll-regex-set-[0-9]*.tgz
          sbom-path: release-artifacts/attest-sbom.cdx.json
      - name: Attest auxiliary npm packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-artifacts/stll-regex-set-[a-z]*.tgz

  core-verify:
    name: Verify Rust core package
    needs: preflight
    if: >-
      (github.event_name == 'workflow_dispatch'
       && inputs.publish_to_npm != true)
      || (github.ref == 'refs/heads/main'
          && (github.event_name == 'push'
              || inputs.publish_to_npm))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.1"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: node scripts/version-sync.mjs check
      - name: Verify publishable core package
        run: cargo publish --dry-run --package stella-regex-set-core --locked

  core:
    name: Publish Rust core
    needs: [preflight, verify, test, pack, attest, core-verify]
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.preflight.result == 'success'
        && needs.preflight.outputs.already-released != 'true'
        && needs.verify.result == 'success'
        && needs.test.result == 'success'
        && needs.pack.result == 'success'
        && needs.attest.result == 'success'
        && needs.core-verify.result == 'success'
        && (github.event_name == 'push'
            || inputs.publish_to_npm))
    uses: stella/.github/.github/workflows/crates-io-publish.yml@437d9d78c38114a15c368daed7d3d1b36fd6b8fc
    with:
      crate-name: stella-regex-set-core
      manifest-path: crates/core/Cargo.toml
    permissions:
      contents: read
      attestations: write
      id-token: write

  core-recovery:
    name: Recover Rust core publication
    needs: [preflight, core-verify]
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.preflight.result == 'success'
        && needs.preflight.outputs.already-released == 'true'
        && needs.core-verify.result == 'success'
        && (github.event_name == 'push'
            || inputs.publish_to_npm))
    uses: stella/.github/.github/workflows/crates-io-publish.yml@437d9d78c38114a15c368daed7d3d1b36fd6b8fc
    with:
      crate-name: stella-regex-set-core
      manifest-path: crates/core/Cargo.toml
    permissions:
      contents: read
      attestations: write
      id-token: write

  finalize:
    name: Finalize
    needs: [preflight, pack, attest, core]
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.preflight.outputs.already-released != 'true'
        && needs.core.result == 'success'
        && (github.event_name == 'push'
            || inputs.publish_to_npm))
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@437d9d78c38114a15c368daed7d3d1b36fd6b8fc
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}
      update-changelog: false
    permissions:
      contents: write
      id-token: write
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
